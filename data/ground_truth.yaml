    reasoning:
      vulnerable_code_path: wger/gym/views/admin_notes.py
      vulnerable_code: "if note.member.userprofile.gym_id != request.user.userprofile.gym_id:"
      why_vulnerable: >-
        The gym-scope guard compares two gym IDs that can both be None. For a trainer with no
        gym viewing a member with no gym, None != None is False, the 403 is skipped, and the
        member's private notes are returned (broken access control, CWE-863).
      why_this_commit: >-
        The flawed guard was copy-pasted into each view as it was written. Finding the
        `gym_id !=` lines in the fix's parent and blaming them: admin notes views -> this commit
        (2014-10-27, the earliest); documents -> b8568c8 (2014-11-01, same PR #85); contracts ->
        eb1f1d9, dd9d3ab, 3637d1a, c91eda0 (2015). All are accepted; this one is primary because
        it is the first and admin notes lead the advisory's list of affected views.
      fix_link: >-
        b51f472 replaces each `gym_id != gym_id` comparison with is_same_gym(), which also
        rejects a None gym.
      confidence: high
  how_verified: >-
    Advisory links only the 2.6 release tag. Found by reading the 2.5...2.6 range (371 commits):
    e1d329f adds is_same_gym() which rejects gym=None; b51f472 replaces the flawed
    "gym_id != gym_id" guard with it in the admin_notes, contract and document views named in the
    advisory; 635d1dc extends the helper to the remaining checks. No PRs (pushed directly).
    Primary = b51f472 because it changes the vulnerable views; e1d329f (which adds the safe helper)
    is accepted too. 635d1dc only extends the helper to other checks, so it is a fix commit but not
    the primary.

