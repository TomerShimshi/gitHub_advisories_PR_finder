    reasoning:
      vulnerable_code_path: src/backend/base/langflow/api/v1/mcp_projects.py
      vulnerable_code: return forwarded_for.split(",")[0].strip()
      why_vulnerable: >-
        get_client_ip() trusts the leftmost X-Forwarded-For entry, which the client fully
        controls. Sending "X-Forwarded-For: 127.0.0.1" passes the local-only check on the MCP
        install endpoint, letting a remote user write MCP config files (CWE-290/CWE-348).
      why_this_commit: >-
        Blame on the fix's parent puts all 8 removed lines of get_client_ip() on this commit,
        which added the one-click MCP install feature with its local-only gate. The advisory's
        range starts at 1.5.0, the release with this feature.
      fix_link: >-
        The fix stops trusting X-Forwarded-For for the locality check and uses the socket peer
        address.
      confidence: high
  how_verified: >-
    Both linked. PR #13915 was merged into the "security-hardening" branch and #14071 into
    "release-1.10.3" (checked via the API); neither commit is in main's history. #13915 is the
    original fix.
