# Hand-checked answers for evaluating the tool. Each entry says how it was verified, and links
# the advisory, every fix commit and every PR so it can be re-checked by hand.
#
# fix.primary       the commit a person would call "the fix"
# fix.also_primary  other commits equally valid as "the fix" (fixes in several equal parts)
# fix.commits       every accepted fix commit (backports and multi-part fixes included), with the
#                   public PR that merged it (null = none exists)
# fix.linked        false when the advisory neither links nor mentions the fix; the deterministic
#                   resolver should then hand over candidates instead of guessing
#
# introduced        the commit that introduced the vulnerability, by the usual definition (SZZ):
#                   the earliest commit that wrote the code the fix changes or guards, skipping
#                   commits that only reformat, rename or move it. When the flaw is a missing
#                   check, it's the commit that added the unguarded code (or the incomplete
#                   check). Cross-checked against the lower bound of the affected-version range.
#   .primary / .also_primary / .commits   as for fix
#   .reasoning      the fields the agent must also produce; `vulnerable_code` is quoted from the
#                   introducing commit's own diff (checked by a script)

