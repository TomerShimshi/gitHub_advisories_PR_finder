[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "advisory-tracer"
version = "0.1.0"
description = "Trace GitHub security advisories to the commits and PRs that introduced and fixed them."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "packaging>=24",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "respx>=0.22,<1",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
tracer = "advisory_tracer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
